name: Migrations

# Migrations are applied by hand, out of band from the deploy: merging a pull
# request ships its code to production immediately, while the SQL beside it sits
# in supabase/migrations until someone runs it. This watches for the gap.
#
# It cannot gate the deploy — Vercel builds from the merge, not from this run —
# so treat a failure here as an alarm on live production rather than a blocked
# release, and go and apply the migration it names.
on:
  push:
    branches:
      - main
  # Catches the drift that a push cannot: a migration applied minutes after its
  # merge (this then turns green on its own), and one nobody ever got round to.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

# Deliberately not on pull_request: a branch that adds a migration has not had
# it applied yet, and failing every such branch would train everyone to ignore
# this check.

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  applied:
    name: Applied to the database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The check has no dependencies of its own — no npm ci — but it does read
      # the database through psql, which the runner image usually ships.
      - name: Ensure psql is available
        run: |
          command -v psql >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          }

      # SUPABASE_DB_URL is the *session pooler* connection string from Supabase
      # → Project Settings → Database. The direct host resolves to IPv6 only,
      # which GitHub's runners cannot reach.
      - name: Check every committed migration is applied
        run: npm run check:migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
